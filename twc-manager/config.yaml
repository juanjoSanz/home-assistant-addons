name: "TWC-Manager"
description: "TWC Manager via RS485"
version: "1.3.2.5"
slug: "twc-manager"
init: false
uart: true
map:
  - "config:rw:/etc/twcmanager"
arch:
  - aarch64
  - amd64
ports:
  8080/tcp: 8081
ports_description:
  8080/tcp: TWC Manager web interface
apparmor: true
webui: "http://[HOST]:[PORT:8080]/"
watchdog: "http://[HOST]:[PORT:8080]/"
ingress: false
options:
  serial:
   enabled: true
   device: "/dev/serial/by-id/usb-WCH.CN_USB_Quad_Serial_BD65F0ABCD-if00"
   baud: "115200"
  config:
    twc_ip: "192.168.1.100"
    # Example: 60 A breaker -> 60 x 0.8 = 48 ; 40 x 0.8 = 32 ; 30 x 0.8 = 24
    fuseAmps: 32,  
    phases: 3         
  mqtt:
    enabled: false
    host: "homeassistant"
    port: 1883
    user: mqtt_twcmanager
    password: xxxxxxxx   
    mqtt_consumption_topic: "homeassistant/sensor/twcmanager_consumption/state"
    mqtt_generation_topic: "homeassistant/sensor/twcmanager_generation/state"
  debug_enabled: false
schema:
  serial:
   enabled: "bool"
   device: "str"
   baud: "str"
  mqtt:
   enabled: "bool"
   host: "str"
   port: "str"
   user: "str"
   password: "str"
  config:
   twc_ip: "str"
   fuseAmps: "str"
   phases: "str"
  debug_enabled: "bool"