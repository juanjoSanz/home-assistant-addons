name: "TWC-Manager"
description: "TWC Manager via RS485"
version: "1.3.2.1"
slug: "twc-manager"
init: false
uart: true
map:
  - "config:rw:/etc/twcmanager"
arch:
  - aarch64
  - amd64
apparmor: true
webui: "http://[HOST]:[PORT:8080]/"
watchdog: "http://[HOST]:[PORT:8080]/"
ingress: true
ingress_port: 8080
ingress_entry: /
options:
  serial:
   enabled: true
   device: "/dev/serial/by-id/usb-WCH.CN_USB_Quad_Serial_BD65F0ABCD-if00"
   baud: "115200"
schema:
  serial:
   enabled: "bool"
   device: "str"
   baud: "str"
  config:
   twc_ip: "str"
  debug_enabled: "bool"